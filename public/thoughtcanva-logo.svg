<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <title>ThoughtCanva Logo</title>
  <desc>ThoughtCanva brand logo with icon mark and wordmark in earthy brown #6D492C</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;display=swap');
      .wordmark { font-family: 'DM Serif Display', Georgia, serif; font-size: 42px; fill: #3A2610; letter-spacing: -1px; }
      .sub-italic { font-style: italic; }
      .tagline { font-family: 'DM Sans', Arial, sans-serif; font-size: 13px; font-weight: 300; fill: #9E7B56; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="680" height="340" fill="#FFFFFF"/>

  <!-- === ICON MARK === -->
  <g transform="translate(182, 88)">
    <!-- Thought bubble background -->
    <rect x="0" y="0" width="92" height="74" rx="20" fill="#F5EDE4" stroke="#C9A07A" stroke-width="1"/>
    <!-- Bubble tail dots -->
    <circle cx="72" cy="82" r="6.5" fill="#F5EDE4" stroke="#C9A07A" stroke-width="0.8"/>
    <circle cx="82" cy="93" r="4.5" fill="#F5EDE4" stroke="#C9A07A" stroke-width="0.8"/>
    <circle cx="90" cy="101" r="3"   fill="#F5EDE4" stroke="#C9A07A" stroke-width="0.8"/>

    <!-- Canvas grid lines -->
    <line x1="30" y1="9"  x2="30" y2="65" stroke="#D4B49A" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="60" y1="9"  x2="60" y2="65" stroke="#D4B49A" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="9"  y1="25" x2="83" y2="25" stroke="#D4B49A" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="9"  y1="49" x2="83" y2="49" stroke="#D4B49A" stroke-width="0.5" stroke-dasharray="2,3"/>

    <!-- Idea dots -->
    <circle cx="30" cy="25" r="5.5" fill="#6D492C"/>
    <circle cx="60" cy="25" r="4"   fill="#A0693E"/>
    <circle cx="30" cy="49" r="4"   fill="#C9A07A"/>
    <circle cx="60" cy="49" r="5.5" fill="#3A2610"/>

    <!-- Connecting curves -->
    <path d="M30,25 Q45,14 60,25" fill="none" stroke="#C9A07A" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M30,49 Q45,60 60,49" fill="none" stroke="#C9A07A" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M30,25 Q20,37 30,49" fill="none" stroke="#C9A07A" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M60,25 Q70,37 60,49" fill="none" stroke="#C9A07A" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- === WORDMARK === -->
  <text x="300" y="148" class="wordmark">
    <tspan>thought</tspan><tspan class="sub-italic" dx="2">canva</tspan>
  </text>

  <!-- Separator -->
  <line x1="300" y1="162" x2="568" y2="162" stroke="#D4B49A" stroke-width="0.5"/>

  <!-- Tagline -->
  <text x="300" y="178" class="tagline">IDEAS MADE VISIBLE</text>
</svg>
